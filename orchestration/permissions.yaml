orchestrator:
  read:
    - "*"
  write:
    - orchestration/
    - research/decisions/

brainstormer:
  read:
    - research/knowledge/
    - research/findings/
    - research/hypotheses/
  write:
    - research/ideas/

implementer:
  read:
    - research/experiments/
    - data/manifests/
    - configs/
  write:
    - src/
    - scripts/
    - configs/
    - outputs/active/

code_reviewer:
  read:
    - src/
    - scripts/
    - tests/
    - research/experiments/
  write:
    - tests/
    - research/experiments/

data_qc:
  read:
    - outputs/active/
    - data/manifests/
    - research/experiments/
  write:
    - research/evidence/

analyst:
  read:
    - research/evidence/
    - outputs/active/
    - research/experiments/
  write:
    - research/findings/

pi_reviewer:
  read:
    - research/findings/
    - research/evidence/
    - research/experiments/
  write:
    - research/experiments/

synthesizer:
  read:
    - research/
  write:
    - research/knowledge/
    - research/weekly-reports/

cleaner:
  read:
    - outputs/
    - research/
  write:
    - archive/

daily_publisher:
  read:
    - research/daily-logs/
    - research/evidence/
    - configs/journal.yaml
  write:
    - research/daily-logs/          # the public_summary field only
  external:
    # The only agent that writes outside this repository.
    - configs/journal.yaml#target.path      # separate journal checkout
  deny:
    - pushing to this repository's remote, by any means
    - publishing a day whose log has no public_summary
    - publishing internal paths, dataset locations or credentials
    - editing a log's observations, interpretations or decisions


critic_findings:
  - "review_001..review_005 — 14 blocking findings raised and resolved across five design
     iterations before the protocol was allowed to lock"
  - "v1.1 redesign, five-lens adversarial panel (mechanism discrimination / strictness /
     statistical validity / executability and cost / pre-registration hygiene). Verdict rule:
     ACCEPT only if zero REVISE, zero REJECT and zero major issues. Three rounds ran; the rule was
     never met and the design/review loop budget (8 of 8) is exhausted. v1.1 remains a DRAFT."
  - "review_006 — ROUND 1, design iteration 6: 5 REVISE, 0 REJECT, 34 major. C3 excludes CpG
     density only and is satisfied by a per-read error-rate filter (B1 keeps 40% of scorable ALT
     reads in a TF0 blank against a 4.91% global keep rate, an 8.1x enrichment with no tumour
     present, at a cutoff of exactly 1/13); S5 leg (a) reproduced only clause (i) of v1.0's S4 and
     §20.6 dropped S4 from the conjunction — the one provable sideways move; the deciding leg had
     no null while its null sd is ~2 z-units; the percentile grid could not be shown to reach its
     targets and retention is a step function with heavy atoms; a positive outcome was invented
     above the preregistered ceiling"
  - "review_007 — ROUND 2, design iteration 7: 5 REVISE, 0 REJECT, 25 major. The pattern-blind
     comparator set omitted the property that GENERATES score_b1 (per-read modification-call
     uncertainty), plus read length, MAPQ and local coverage; C1's draw count raised 200 -> 2000
     silently re-parameterised preregistered S1, S4 clause (ii) and F8 and would deterministically
     fire F11; the bootstrap was used as a null so every refutation label was structurally
     unreachable; null_sd was never defined; and the 28 input BAMs no longer exist, having been
     converted to CRAM on 2026-09-12 [EV-0052], while the draft asserted the inputs were identical"
  - "review_008 — ROUND 3, design iteration 8: 5 REVISE, 0 REJECT, 17 major. Major-issue trajectory
     34 -> 25 -> 17, no REJECT at any round. The surviving lead finding is that the BLANK_TRIPLE
     determination fires by construction at every evaluable target in AXIS-L x V1 and AXIS-B x V2
     and its consequence clause has no stated scope, so S6 — the criterion written to answer
     QC-02 — is either unsatisfiable on all data or carried only by rows the protocol itself calls
     a re-expression of the QC-01 tie. Also surviving: the permutation legs have no computable
     refutation rule, so labels L-D and L-F are unreachable; no null in the design isolates
     methylation PATTERN; null_sd is still not operationally defined and the frozen support script
     computes it by the forbidden reading; the 11.7x blank-spread inflation is an UNGATED figure
     from a record FIND-0018 marks superseded by EV-0038; and the propagated WITHDRAWAL_BASIS
     string attributes a POST HOC withdrawal to 'EXEC-001 plus qc_001.md'"

assumptions:

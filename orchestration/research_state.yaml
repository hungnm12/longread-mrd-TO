success_criteria: >-
  BM-0001 concludes when the mechanism question is answered in either direction under criteria
  that are strictly harder than v1.0's and permanently labelled POST HOC: either methylation
  pattern outperforms the CpG-density control at matched realised ALT retention, or it does not
  and H1's mechanism half is withdrawn. Project-level success is the THESIS-PLAN claim, which
  needs n > 2 individuals and is not reachable inside this benchmark.

next_action: >-
  HUMAN DECISION REQUIRED (AGENTS.md rules 2 and 10; the orchestrator may not resolve this).
  Three options, none of which an agent may take unilaterally: (a) extend max_design_iterations /
  max_review_iterations and return to benchmark-designer with the 17 surviving major issues in
  reviews/review_008.md; (b) accept v1.1 with those 17 findings recorded as open limitations and
  proceed to EXEC-002 — noting that the panel found the deciding criterion S6 may be unsatisfiable
  on any data (review_008, R3-L2-01) and that the draft's own §20.6 clause 0b already closes the
  positive branch before the run; or (c) stop BM-0001 at the v1.0 registered outcome plus
  qc_001.md, leaving the mechanism half of H1 recorded as UNDERDETERMINED rather than withdrawn.
  Under every option v1.0 and EXEC-001 stay preserved unmutated and no v1.1 result may be entered
  into this file's known_evidence without its POST HOC label.

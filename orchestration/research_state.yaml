# Shared research state — Autonomous Research Orchestration Specification §4.
#
# Instantiated 2026-09-19 from artifacts already on disk. This file does NOT introduce new
# scientific content: every field below is transcribed from research/, and where the pasted
# specification carried a placeholder the value is taken from the repository rather than invented.
# The authoritative per-benchmark state remains

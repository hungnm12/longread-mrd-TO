  - "The dilution mixtures realise their nominal tumour fraction only approximately: measured
     0.93x / 0.85x / 0.39x of nominal on HCC1395 [FIND-0016]"
  - "PCR-free library preparation — ASSUMED, never verified on these BAMs"

limitations:
  - "Cell-line dilution, not plasma. Fragmentomics is not obtainable from this material."
  - "n = 2 individuals. Two individuals cannot choose between two decision rules."
  - "One caller's candidate set throughout: this measures a decision rule on top of a caller,
     not a caller."
  - "No limit of detection is claimed. The blank design supports one effective replicate."


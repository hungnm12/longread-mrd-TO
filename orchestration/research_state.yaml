# view the specification asks for and must be kept consistent with it.

research_goal: >-
  Can long-read ONT provide additional evidence that helps distinguish tumour-derived signal from
  biological and technical background, in a TUMOUR-ONLY setting (no matched normal)?
  [research/research-os.json]

current_question: >-
  Does per-read native methylation select tumour-derived reads at a tumour-only SNV candidate set,
  or does the apparent gain come from filter aggressiveness / CpG density / counting statistics?
  [BM-0001, reopened by qc/qc_001.md]

current_hypothesis: >-
  H1 (BM-0001 §3): adding a per-read methylation score to the frozen SNV count gate raises
  zlo_min at 0.1% above the SNV-only baseline B0 and above both controls, on both individuals,
  under both variance constructions.
  STATUS: mechanically SUPPORTED under locked protocol v1.0; the mechanism half is UNDERDETERMINED
  because QC-01 showed the criterion carrying it (S4) is satisfied identically by the
  methylation-blind CpG-density control C2.

hypothesis_history:
  - id: G1-linkage
    statement: Long-range same-molecule ALT-ALT linkage is tumour-specific evidence
    outcome: PARTIALLY FALSIFIED then RESCUED — pre-registered specificity criterion failed
      (65.1% somatic vs 78.6% non-somatic, EXP-G1-001); EXP-G1-002 showed the excess was private
      germline in cis; EXP-G1-003 survived the registered low-TF falsification
    refs: [EXP-G1-001, EXP-G1-002, EXP-G1-003, FIND-0001, FIND-0002, FIND-0003]
  - id: S1-hapVAF
    statement: Haplotype-specific allele fraction separates germline from somatic better than VAF
    outcome: FALSIFIED — dAUC -0.0346, 95% CI [-0.0676, +0.0015] against registered H0 of >+0.02.
      Worse than a haplotype-swap null. Direction abandoned under its own failure criterion
    refs: [EXP-S1-001, FIND-0004, EV-0019]
  - id: S1-gate
    statement: Gating the OBSERVATION (1<=alt<=2 reads) removes germline background without
      identifying it
    outcome: SUPPORTED and STABLE — 99.67% background removal, 97.4% somatic retention at 1%
    refs: [EXP-S1-004, EXP-S1-005, EXP-S1-020]
  - id: S1-stack
    statement: Gate + panel-of-normals + variance model jointly improve tumour-only accuracy
    outcome: FALSIFIED by the project's own ablation grid — the gate is the only factor that
      changes a detection call; everything else moves margins
    refs: [EXP-S1-020, FIND-0020, THESIS-PLAN.md §1]
  - id: S1-mechanism-coverage
    statement: The gate works because it scales with coverage / needs a minimum coverage
    outcome: FALSIFIED TWICE IN ONE DAY (EXP-S1-020d, EXP-S1-020f). Recorded as a warning against
      mechanism claims, not as a finding
    refs: [THESIS-PLAN.md §3]
  - id: BM-0001-H1
    statement: Per-read native methylation selects tumour-derived reads on top of the SNV gate
    outcome: ACTIVE — see current_hypothesis
    refs: [BM-0001, FIND-0021, EXP-S1-022]

known_evidence:
  - "FACT: the gate removes 99.67% of tumour-free background (11,669 -> 39 ALT reads on HCC1395
     chr1) while retaining 221/227 somatic ALT reads at 1% [EXP-S1-004]"
  - "FACT: 1% is detected in every arm, individual, variance model and reporting mode
     [THESIS-PLAN.md §3]"
  - "FACT: 0.01% is detected NOWHERE — 0/3 in every configuration on both individuals
     [EXP-S1-002, EXP-S1-004, FIND-0015]"
  - "FACT: a per-CpG methylation consensus built from a >99.9%-normal sample classifies individual
     long reads as tumour- or normal-derived at AUC 0.9067 on chr1; the gain is attributable to
     POSITION SELECTION (0.6417 -> 0.9067), not to position-specific scoring [FIND-0021, EXP-S1-022]"
  - "FACT: leakage verified by file-open capture across 42 workers — 31 paths, no matched normal,
     no SEQC2, no PoN, no population database [qc_001.md QC-07]"
  - "FACT: two independent implementations written months apart agree to four figures on the
     primary metric (zlo_min +0.7396 vs +0.74; +2.2995 vs +2.30) [qc_001.md QC-08]"
  - "FACT: three independent HCC1395BL libraries exist on this server; between-library blank sd is
     11.7x larger than the five pseudo-blanks' [FIND-0018, EXP-S1-016]"

contradictory_evidence:
  - "AGAINST the mechanism claim: C2, which uses NO methylation pattern, reproduces B1's
     differential-retention signature to within 0.6% (HCC1395 1.6741 vs 1.6839) and 0.3%
     (COLO829 2.9127 vs 2.9041) [qc_001.md QC-01]"
  - "AGAINST a clean S1 win: B1 counts 8-10x as many reads as either control at 0.1%, so the z
     comparison is decided at different points on a precision curve rather than at matched
     aggressiveness [qc_001.md QC-02]"
  - "AGAINST 'methylation enables 0.1% detection': the DETECTION outcome changes in 1 of 4
     individual x construction cells [qc_001.md QC-03]"
  - "AGAINST four-figure precision: COLO829's S4 ratio of 2.9127 is computed from roughly three
     kept blank reads [qc_001.md QC-04]"
  - "AGAINST the count gate as best practice: a VAF ceiling tightened to 0.05, selected on one
     individual by a rule fixed in advance, beats it on DETECTION on the other [EXP-S1-020c,
     FIND-0020]"

open_questions:
  - "Does B1's zlo_min exceed C2's AT MATCHED REALISED ALT RETENTION? (QC-02; the deciding test)"
  - "Does B1's differential retention exceed C2's, not merely its own blank? (QC-01)"
  - "Does any of this replicate beyond n=2 individuals? Four more cell lines exist but need
     candidates re-derived with the ClairS-TO `ss` model [THESIS-PLAN.md §5]"
  - "Are the project's BAMs genuinely PCR-free? The 'methylation is free' claim rests on it and
     the command was written 2026-09-01 and never run [daily-logs/20260901 item 3]"
  - "A1: what is the somatic/germline/artifact composition of the 48,819 PASS candidates?
     [open-questions.md, SUG-2026-08-001]"


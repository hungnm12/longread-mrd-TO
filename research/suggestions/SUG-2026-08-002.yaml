suggestion: >-
  Define "tumor recognition" as a measurable evaluation metric before comparing any methods.
my_interpretation: >-
  The phrase currently names an intuition, not a quantity. It must become something computable on a
  defined unit — per candidate, per molecule, or per sample — with a stated positive class.
why_it_matters: >-
  Without a metric there is no way to say that one evidence configuration is better than another, so
  no ablation can be scored and no hypothesis can be rejected.

suggestion: >-
  Treat the contribution of phase and native methylation evidence as something to be tested by
  ablation, not assumed.
my_interpretation: >-
  The three admissible outcomes are complementary, redundant, and unhelpful. The design must be able
  to produce all three, which means the ablation is part of the experiment, not a follow-up to it.
why_it_matters: >-
  A design that can only show improvement will show improvement. Stating this before implementation
  is what keeps the eventual result interpretable.

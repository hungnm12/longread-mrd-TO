suggestion: >-
  Determine the somatic, germline and technical-artifact composition of the tumor-only PASS SNV
  candidate set before treating any of it as an MRD marker set.
my_interpretation: >-
  A candidate count is not an analysis population until its composition is known. Without a
  composition estimate, every downstream metric is measured against an undefined denominator.
why_it_matters: >-
  Tumor-only calling has no matched normal to subtract, so germline and recurrent artifact classes
  stay inside the candidate set. Any recognition metric computed before that is uninterpretable.

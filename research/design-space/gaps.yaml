# Candidate design-space gaps.
#
# "Underexplored" here means: not represented in the seven documents reviewed in this repository.
# It does NOT mean unstudied in the field. No systematic literature search has been run, so every
# entry below carries that scope limit and none may be described as novel.
#
# Nothing here is selected as the thesis direction. G2 is the previously parked direction, listed
# as one candidate among others with no privileged status.

version: 1
updated: 2026-08-19
# Gap state is multi-dimensional on purpose. A gap can have a supported physical premise and an
# unsupported claim to specificity at the same time, and collapsing that into one PASS/FAIL badge
# would misreport what is known. Dimension values:
#   UNEXPLORED · OBSERVED · FEASIBILITY-TESTED · HYPOTHESIS-CANDIDATE · EXPERIMENTING
#   SUPPORTED · NOT-SUPPORTED · INCONCLUSIVE · UNRESOLVED · BLOCKED · PARKED · PREREQUISITE
#
# `component` places a gap in the detector model (detector-components.yaml). Gaps are NOT five
# equivalent hypotheses: they sit at different stages and can be complementary.

scope_limit: >-
  Coverage claims are relative to the seven reviewed documents only. A documented systematic
  search has not been run — see research/knowledge/open-questions.md D3.

well_explored:
  - Genome-wide aggregation of weak per-locus SNV evidence, tumor-informed [1,2]
  - Learned background suppression on short-read sequence context [2]
  - Linkage-based suppression within a short cfDNA fragment [3]
  - Physical accuracy improvement by consensus on long reads [5]
  - Native multi-class readout from one ONT library, at region scale [4,5]
  - Analytical validation framing — LoB, LoD, precision [3]

partially_explored:
  - Long reads used for multimodality but not for linkage-based background suppression [4,5]
  - Multimodal aggregation with modality independence assumed rather than tested [2,5 vs 6]

gaps:
  - id: G1
    component: molecule-recognition
    subcomponent: molecular-linkage
    secondary_components: [background-suppression]
    stage: FEASIBILITY-TESTED
    state:
      - dimension: Physical linkage feasibility
        value: SUPPORTED
        basis: EXP-G1-001 — 67.9% of evaluable pairs show at least one both-ALT read
      - dimension: Somatic specificity
        value: NOT-SUPPORTED
        basis: 65.1% for SEQC2-confirmed pairs vs 78.6% where neither candidate is confirmed
      - dimension: MRD usefulness
        value: UNRESOLVED
        basis: Not tested — needs the blank and dilution comparison
    active_question: >-
      Does ALT-ALT linkage track tumor fraction, or does it persist in TF0 blanks as background
      haplotype structure?
    next_experiment: Same co-occurrence statistic on the five TF0 blanks and the 1%, 0.1%, 0.01% dilutions
    title: Long-range same-molecule linkage for tumor-only detection
    axes_combined: [evidence-linkage, background-suppression, marker-discovery, detection-unit]
    closest_methods: [phased-seq, nanorcs]
    what_is_actually_different: >-
      PhasED-Seq requires two somatic variants inside one short cfDNA fragment, is tumor-informed
      and uses a matched-normal design. Long reads extend the co-observation window from hundreds
      of bases to kilobases, which changes how often the opportunity exists — and the candidates
      here come from a tumor-naive caller, so no prior tumor profile is assumed. NanoRCS has the
      read length but spends it on consensus and multimodality, not on linkage.
    required_ont_capability: [read-span, same-molecule-cooccurrence, snv-calls]
    required_data: Dilution series with blanks; candidate set; per-read labels for evaluation only
    feasibility: >-
      Premise measured (EXP-G1-001, FIND-0001). Proximity: 34.8% of PASS candidates have another
      within 10 kb. Co-observation: 67.9% of 999 sampled pairs had at least one read carrying both
      ALT alleles in the pure tumor sample, 662 pairs with two or more such reads. What remains is
      the same statistic at low tumor fraction and against the blanks.
    confounding_risks:
      - "OBSERVED, not hypothetical: co-occurrence is more common among pairs where neither candidate is a confirmed somatic SNV (78.6%) than where both are (65.1%), which is what germline heterozygous variants in cis would produce."
      - Candidate pairs in close proximity may be enriched for the same artifact class, so co-occurrence could mark a shared error mode rather than shared origin.
      - SEQC2 covers high-confidence regions only, so "not in SEQC2" is not "not somatic" and the stratification is weaker than it looks.
      - Pure tumor is the most favourable case by construction; nothing here measures low tumor fraction.
    falsification: >-
      Count co-observed candidate pairs per dilution. If the count at 0.1% and 0.01% is
      indistinguishable from the blanks, linkage carries no usable signal at those fractions and
      the direction dies on this data.
    status: premise-measured
    evidence: [EXP-G1-001, FIND-0001, EV-0010]
    tracking: research/design-space/gaps.md#g1
    journey:
      - step: Why this gap exists
        kind: LITERATURE
        text: >-
          ONT long reads may span several nearby candidate variants, creating a physical linkage
          window far larger than a short cfDNA fragment. PhasED-Seq suppresses background by
          requiring co-occurrence within one fragment; the reach of that window decides how often
          the opportunity exists at all.
      - step: Initial observation
        kind: MEASURED
        text: >-
          21.3% of PASS candidates have another PASS candidate within 5 kb; 34.8% within 10 kb;
          median read length approximately 11.3 kb.
        caveat: Coordinate proximity is an opportunity. It is not evidence of same-molecule linkage.
      - step: Research question
        kind: QUESTION
        text: Do nearby ALT candidates actually occur together on the same ONT molecule?
      - step: Experiment
        kind: EXPERIMENT
        text: >-
          candidate proximity → reads spanning both loci → ALT/ALT co-observation → multi-read
          support. 1,000 seeded pairs within 20 kb, pure tumor, MAPQ >= 20.
        ref: EXP-G1-001
      - step: Result
        kind: MEASURED
        text: >-
          ALT-ALT same-molecule co-occurrence is real and routinely observed with multi-read
          support: 67.9% of 999 evaluable pairs, and 662 pairs with two or more supporting reads.
      - step: Pre-registered prediction
        kind: HYPOTHESIS
        text: >-
          If linkage is tumor-specific evidence, pairs where both candidates are confirmed somatic
          should show stronger ALT-ALT enrichment than pairs where neither is.
      - step: Unexpected result
        kind: MEASURED
        text: >-
          SEQC2-confirmed somatic pairs 65.1%. Pairs with neither candidate confirmed by SEQC2
          78.6%. The prediction was contradicted, in the opposite direction.
        caveat: >-
          Absence from SEQC2 is not proof of non-somatic origin; SEQC2 covers high-confidence
          regions only.
      - step: Interpretation
        kind: INTERPRETATION
        text: >-
          Physical linkage exists, but linkage alone is not tumor-specific. Candidate composition
          and germline haplotype structure are plausible confounders.
        boundary: >-
          This does not show that G1 improves MRD detection, and does not show that linked ALT
          molecules are tumor-derived.
      - step: Next question
        kind: UNRESOLVED
        text: >-
          Does ALT-ALT linkage track tumor fraction, or does it persist in TF0 blanks as background
          haplotype structure?

  - id: G2
    component: molecule-recognition
    subcomponent: epigenetic-state
    secondary_components: [background-suppression]
    stage: HYPOTHESIS-CANDIDATE
    state:
      - dimension: Evidence availability
        value: SUPPORTED
        basis: Native 5mC and 5hmC present on every sampled read; haplotype context abundant
      - dimension: Phasing feasibility
        value: UNRESOLVED
        basis: Nothing phased yet; phase block length at 25x is unmeasured
      - dimension: Discriminative value
        value: UNEXPLORED
        basis: No ablation has been designed or run
    active_question: How long are phase blocks at 25x, and how many molecules carry allele, phase and methylation together?
    next_experiment: LongPhase on one region of one dilution BAM, then a joint-availability count
    title: Haplotype-conditioned native methylation on the same molecule
    axes_combined: [evidence-per-observation, evidence-linkage, background-suppression, modality-independence]
    closest_methods: [phased-seq, ont-cfdna-methylation, methylation-fragmentation]
    what_is_actually_different: >-
      Uses the haplotype background of a single variant, plus that molecule's methylation state, in
      place of PhasED-Seq's requirement for a second somatic variant. No reviewed method reads
      allele, phase context and native methylation off one molecule.
    required_ont_capability: [native-5mc, native-5hmc, haplotype-tags, phase-blocks, methylation-calibration]
    required_data: Dilution series; a germline het set for phasing; blanks
    feasibility: >-
      Blocked on two unmeasured things: phase block length at 25x, and how many molecules carry
      allele, phase and methylation together. Both are cheap to measure and neither has been.
    confounding_risks:
      - Methylation is coupled to fragmentation rather than independent [6], so an apparent gain may be re-encoded information.
      - Methylation calls are protocol-sensitive [7] and the basecaller model is unrecorded here.
      - Haplotype context does not exist until phasing succeeds, and it may not at low coverage.
    falsification: >-
      Ablate: sequence alone, sequence + phase, sequence + methylation, all three. If the full
      configuration does not separate from the sequence-only baseline on the same molecules, the
      added modalities are redundant in this setting.
    status: candidate
    note: >-
      This was the project's previous direction. It was parked on 2026-08-19 and appears here as
      one candidate among others, with no privileged position.

  - id: G3
    component: molecule-recognition
    cross_cutting: measurement-quality
    secondary_components: [background-suppression]
    stage: BLOCKED
    state:
      - dimension: Native side measurable here
        value: SUPPORTED
        basis: Per-read quality and modification calls are available in these BAMs
      - dimension: Consensus side measurable here
        value: BLOCKED
        basis: No amplified library exists; the comparison can only be half-run
      - dimension: Trade-off magnitude
        value: UNEXPLORED
        basis: Nothing measures what per-read error costs at the candidate level
    active_question: What does per-read error cost at the candidate level, and do modification calls offset it?
    next_experiment: Deferred — half the comparison is unavailable on this material
    title: Native-molecule accuracy versus modality — the unexamined trade
    axes_combined: [measurement-accuracy, evidence-per-observation, platform-deployability]
    closest_methods: [nanorcs, real-time-ont]
    what_is_actually_different: >-
      The reviewed set contains one method that buys accuracy with amplification (losing native
      modifications) and one that keeps the molecule native (accepting per-read error). Nothing
      measures what is given up either way on the same material.
    required_ont_capability: [read-error-context, native-5mc, snv-calls]
    required_data: Pure tumor and blanks; no dilution needed for the first pass
    feasibility: >-
      Partially measurable. The native side is measurable here; the consensus side is not, because
      no amplified library exists. This is a comparison this project can only half-run.
    confounding_risks:
      - Comparing to published consensus performance across different samples would be exactly the incompatible-numbers comparison this project forbids.
    falsification: >-
      Quantify how much per-read error costs at the candidate level, and whether modification
      calls add enough to offset it. A null here would mean the native trade is not worth taking.
    status: candidate-limited

  - id: G4
    component: decision-rule
    secondary_components: [validation]
    stage: UNEXPLORED
    state:
      - dimension: Resources available
        value: SUPPORTED
        basis: Five TF0 replicates on disk, produced by the same pipeline as the others
      - dimension: Blank distribution characterised
        value: UNEXPLORED
        basis: Not attempted
      - dimension: Independence of blanks
        value: INCONCLUSIVE
        basis: The five share one subsampling source, so they are not independent libraries
    active_question: How wide is the blank distribution, and does any threshold separate 1% from 0%?
    next_experiment: Characterise the blank distribution across the five TF0 replicates
    title: Blank-anchored decision rule for a tumor-only long-read detector
    axes_combined: [decision-threshold, validation, detection-unit]
    closest_methods: [phased-seq]
    what_is_actually_different: >-
      The reviewed set's only blank-anchored framework is short-read, targeted and tumor-informed.
      No reviewed method defines a decision rule against measured blanks for a tumor-naive
      long-read setting.
    required_ont_capability: [snv-calls, negative-control]
    required_data: The five TF0 replicates — already on disk
    feasibility: >-
      Feasible and cheap, and it does not depend on which evidence axis is eventually chosen. Five
      blank replicates is the usual minimum for a rudimentary limit-of-blank estimate.
    confounding_risks:
      - Five replicates from one subsampling pipeline share their source; they are not independent libraries, so the estimated blank distribution is narrower than a true one.
      - A limit of blank on cell-line dilution says nothing about plasma.
    falsification: >-
      If the blank distribution is so wide that no threshold separates 1% from 0%, the whole
      detection question on this material is answered negatively — which is itself a result.
    status: candidate

  - id: G5
    component: marker-discovery
    role: PREREQUISITE
    secondary_components: [molecule-recognition, background-suppression, validation]
    stage: EXPERIMENTING
    state:
      - dimension: Necessity
        value: SUPPORTED
        basis: FIND-0001 — co-occurrence could not be attributed to tumor origin without composition
      - dimension: Class definitions
        value: UNEXPLORED
        basis: Not written; counting before defining classes would have no stable meaning
      - dimension: Composition estimate
        value: UNEXPLORED
        basis: Not attempted
    active_question: What are the somatic, germline and recurrent-artifact fractions of the PASS candidate set?
    next_experiment: Define composition classes, then estimate with population resources and the panel of normals
    title: Tumor-naive marker discovery as an MRD strategy
    axes_combined: [marker-discovery, background-suppression]
    closest_methods: []
    what_is_actually_different: >-
      Every reviewed detection method is tumor-informed. This project's candidate set is
      tumor-naive, which is a different problem: the marker set carries its own false-positive
      structure rather than being validated in advance by tumor sequencing.
    required_ont_capability: [snv-calls]
    required_data: Candidate set, population resources, SEQC2 for evaluation only
    feasibility: >-
      This is the composition question (SUG-2026-08-001) in design-space terms, and it is a
      precondition for every other gap: no recognition metric is definable over a set of unknown
      composition. Promoted from foundational to operative by FIND-0001, where co-occurrence was
      higher among unconfirmed pairs than among confirmed-somatic ones.
    confounding_risks:
      - Estimating composition with the same population resources that produced the candidates is circular for the germline fraction.
      - SEQC2 may be used to evaluate composition but never to select candidates.
    falsification: >-
      If the retained set proves to be dominated by germline and recurrent artifact, tumor-naive
      discovery is not a viable base for any of the other gaps on this data.
    status: candidate-foundational

infeasible_here:
  - id: X1
    title: Fragmentomics-based detection
    reason: >-
      This is cell-line genomic DNA, not cfDNA. Fragment ends reflect library preparation, not the
      nuclease biology that makes cfDNA fragmentomics informative. The axis cannot be tested on
      this material regardless of what the literature does with it.
    would_require: Plasma cfDNA sequenced on the same platform
  - id: X2
    title: Consensus-accuracy designs
    reason: The data is simplex with no amplification-based consensus; the NanoRCS route is unavailable.
    would_require: A rolling-circle or duplex library, which would in turn lose native modifications
  - id: X3
    title: Any clinical MRD performance claim
    reason: Cell-line genomic dilution is not a patient sample; no cohort exists here.
    would_require: A clinical cohort and a different study design entirely
